# ==========================================================================
# 同域反代：/ 学生端静态 · /admin/ 后台静态 · /api/ 接口
# ==========================================================================
# ⚠️ 这份 **没有在本机跑过** —— 开发机上没有 nginx。上线前在服务器上先 `nginx -t` 再 reload。
#
# HTTPS 有两种做法，二选一：
#   方式 A（推荐，最省事）证书交给云厂商 / CDN，源站只听 80，这份文件直接用
#   方式 B（自己签）照 deploy/optional/https.conf.example 复制一份到 deploy/optional/，
#                  再用 certbot 签证书，命令在上线手册里
# 两种做法都要求**浏览器最终看到的是 HTTPS** —— 生产环境的 Cookie 带 Secure，没有 HTTPS 就登不上。
# ==========================================================================

upstream wukong_api {
    # 容器名就是 compose 里的服务名，Docker 内置 DNS 会解析
    server api:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 大一点的请求体：导出、正文里的大图都要过得去
    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # certbot 的 http-01 校验走这里（方式 B 才用得上）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- 接口 ----
    # ⚠️ `proxy_pass` **不带路径**，这一点是关键：接口服务自己的路径里就带 /api
    #    （app.use('/api', ...)），写成 `proxy_pass http://wukong_api/;` 会把 /api 前缀吃掉，
    #    结果是每个接口都 404 —— 而且看起来像是"服务没起来"。
    location /api/ {
        proxy_pass http://wukong_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 单号从 Nginx 一路传到接口：接口日志里 rid= 就是同一个值，
        # 出问题时按这个号能把两边串起来（见 apps/api/src/middleware/request-log.ts）
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        # 支付回调要等渠道的响应，给宽一点
        proxy_read_timeout 60s;
    }

    # ---- 管理后台 ----
    location = /admin { return 301 /admin/; }

    location /admin/assets/ {
        alias /srv/admin/assets/;
        # 后台的文件名带内容哈希，改动必换名 —— 所以可以放心长缓存
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /admin/ {
        alias /srv/admin/;
        # 后台是前端路由：直接访问 /admin/users 时没有这个文件，得回 index.html
        try_files $uri $uri/ /admin/index.html;
        # 而 index.html 绝不能缓存，否则发版后用户还拿着旧的入口，一直去要已经删掉的 js
        add_header Cache-Control "no-cache";
    }

    # ---- 学生端 ----
    location / {
        root /srv/web;
        index index.html;
        # 学生端的文件名**不带哈希**（assets/js/api.js 一直叫这个名字），
        # 所以这里不能设长缓存：让浏览器每次回源协商，服务端有 ETag，304 很便宜。
        # 设成 max-age=604800 的话，一个 bug 修完要等一周才到用户手上。
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}

# 有没有 HTTPS 就看这个目录里有没有文件（compose 已经把 deploy/optional 挂进来了）。
# 通配符匹配不到东西时 nginx 不报错，所以没启用 HTTPS 也能正常启动。
include /etc/nginx/conf.d/optional/*.conf;
